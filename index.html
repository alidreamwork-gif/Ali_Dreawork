<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Dreamwork Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f3f4f6; display: flex; justify-content: center; }
    .app-wrapper { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; padding-bottom: 30px; position: relative; }
    
    /* नीली पट्टी का हेडर */
    .top-navbar { 
      background: #1e40af; 
      padding: 8px 10px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      gap: 6px; 
    }
    .nav-brand-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .nav-brand-left img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #000000;
      object-fit: cover;
      background: #fff;
    }
    /* ब्रांड नेम - गोल्डन कलर */
    .nav-brand-title {
      color: #fbbf24;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.1;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .nav-buttons-right { 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
      align-items: flex-end; 
    }
    .nav-row {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
    }
    .nav-btn { 
      background: rgba(255,255,255,0.25); 
      border: 1px solid rgba(255,255,255,0.4); 
      color: white; 
      padding: 4px 7px; 
      border-radius: 12px; 
      font-size: 10px; 
      cursor: pointer; 
      font-weight: bold; 
      white-space: nowrap;
    }
    .nav-btn.active { background: #fff; color: #1e40af; }

    .container { padding: 12px; }
    .page-section { display: none; }

    /* कार रश बैनर */
    .banner-wrapper { margin: 2px 0 12px 0; text-align: center; }
    .race-banner-img { 
      width: 100%; 
      height: auto; 
      border-radius: 12px; 
      display: block; 
      cursor: pointer; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.12); 
    }

    /* सेफ पॉपअप मॉडल (ब्लैंक एरर फ्री) */
    #racePopupModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 999999;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .popup-content-box {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 14px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1.5px solid #2563eb;
    }

      position: absolute;

      background: rgba(0, 0, 0, 0.7);
