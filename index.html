<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Dreamwork Store</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f3f4f6; margin: 0; padding: 10px; display: flex; justify-content: center; }
    .wrapper { width: 100%; max-width: 450px; background: #fff; min-height: 100vh; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
    
    .top-bar { background: #1e40af; padding: 12px; text-align: center; }
    .brand { color: #fff; font-size: 17px; font-weight: bold; margin-bottom: 8px; }
    .nav { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; }
    .nav button { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 12px; border-radius: 15px; font-size: 11px; cursor: pointer; font-weight: bold; }
    .nav button.active { background: #fff; color: #1e40af; }

    .content { padding: 15px; flex: 1; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .logo-box { text-align: center; margin-bottom: 12px; }
    .logo-box img { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #d97706; }
    .logo-box div { font-size: 18px; font-weight: bold; color: #1f2937; margin-top: 5px; }

    .box { border: 1px solid #e5e7eb; padding: 14px; border-radius: 10px; background: #fff; }
    label { display: block; font-size: 13px; font-weight: bold; color: #374151; margin-top: 10px; }
    .input-row { display: flex; gap: 6px; margin-top: 5px; }
    input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
    .verify-btn { background: #059669; color: #fff; border: none; padding: 0 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #verifyRes { margin-top: 8px; font-size: 12px; padding: 8px; border-radius: 6px; display: none; }

    .grid-title { font-size: 13px; font-weight: bold; color: #d97706; margin: 15px 0 10px 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
