<script>
    function changeTab(tabId, btnElement) {
      var sections = document.querySelectorAll('.page-section');
      sections.forEach(function(sec) {
        sec.classList.remove('active-page');
        sec.style.display = 'none';
      });

      var buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(function(btn) {
        btn.classList.remove('active');
      });

      var activeTarget = document.getElementById('tab-' + tabId);
      if (activeTarget) {
        activeTarget.style.display = 'block';
        activeTarget.classList.add('active-page');
      }
      
      if (btnElement) {
        btnElement.classList.add('active');
      }
      window.scrollTo(0, 0);
    }

    var cart = {}; 
    var isVerified = false;

    function updateQty(index, pagesPerItem, pricePerItem, change) {
      if (!cart[index]) {
        cart[index] = { pages: pagesPerItem, price: pricePerItem, qty: 0 };
      }
      
      cart[index].qty += change;
      if (cart[index].qty < 0) cart[index].qty = 0;

      var qtyElem = document.getElementById('qty-' + index);
      if (qtyElem) qtyElem.innerText = cart[index].qty;

      var cardElem = document.getElementById('card-' + index);
      if (cardElem) {
        if (cart[index].qty > 0) {
          cardElem.classList.add('selected');
        } else {
          cardElem.classList.remove('selected');
        }
      }

      if (cart[index].qty === 0) {
        delete cart[index];
      }

      updateSummary();
    }

    function updateSummary() {
      var totalPages = 0;
      var totalPrice = 0;

      for (var key in cart) {
        var item = cart[key];
        totalPages += item.pages * item.qty;
        totalPrice += item.price * item.qty;
      }

      var sumPlan = document.getElementById('sumPlan');
      var sumPrice = document.getElementById('sumPrice');

      if (Object.keys(cart).length === 0) {
        if (sumPlan) sumPlan.innerText = "None";
        if (sumPrice) sumPrice.innerText = "₹0";
      } else {
        if (sumPlan) sumPlan.innerText = totalPages.toLocaleString() + " Pages";
        if (sumPrice) sumPrice.innerText = "₹" + totalPrice;
      }
    }

    function verifyUser() {
      var uidInput = document.getElementById('userId');
      var resBox = document.getElementById('verifyResult');
      
      if (!uidInput || !uidInput.value.trim()) {
        alert('Please enter User ID first');
        return;
      }

      var uid = uidInput.value.trim();
      resBox.style.display = "flex";
      resBox.innerHTML = "Verifying...";

      fetch('/api/verify-user', {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uid: uid })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.code === 200 || data.status === 200 || data.success === true || data.nick) {
          isVerified = true;
          var info = data.data || data;
          var name = info.nick || info.name || "Verified User";
          var avatar = info.avatar || info.img || "https://i.ibb.co/21P3nGZR/logo.jpg";
          resBox.innerHTML = '<img src="' + avatar + '" class="user-avatar"> <div><b>' + name + '</b><br><small>ID: ' + uid + ' (Verified ✅)</small></div>';
        } else {
          isVerified = false;
          resBox.innerHTML = "<span style='color:red;'>❌ Invalid User ID</span>";
        }
      })
      .catch(function(err) {
        console.error(err);
        isVerified = false;
        resBox.innerHTML = "<span style='color:red;'>❌ Server Error</span>";
      });
    }

    function initiatePayment() {
      var uidInput = document.getElementById('userId');
      var phoneInput = document.getElementById('userPhone');

      var uid = uidInput ? uidInput.value.trim() : "";
      var phone = phoneInput ? phoneInput.value.trim() : "";

      var totalPrice = 0;
      for (var key in cart) {
        totalPrice += cart[key].price * cart[key].qty;
      }

      if (!uid || totalPrice === 0 || !phone) {
        alert('Please fill ID, select at least one plan (+ quantity) and enter WhatsApp number.');
        return;
      }
      if (!isVerified) {
        alert('Please verify your User ID first.');
        return;
      }

      // Call backend to create order
      fetch('/api/create-cashfree-order', {
        method: "POST",
        headers: { 
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ 
          uid: uid,
          amount: totalPrice, 
          whatsapp: phone 
        })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.success && data.payment_session_id) {
          // Load Cashfree SDK Dynamically to prevent ReferenceError
          var script = document.createElement('script');
          script.src = "https://sdk.cashfree.com/js/v3/cashfree.sandbox.js";
          script.onload = function() {
            const cashfree = Cashfree({ mode: "sandbox" });
            let checkoutOptions = {
              paymentSessionId: data.payment_session_id,
              redirectTarget: "_modal"
            };
            cashfree.checkout(checkoutOptions).then(function(result) {
              if (result.error) {
                alert("Payment failed: " + result.error.message);
              }
            });
          };
          script.onerror = function() {
            alert("Failed to load Cashfree SDK. Check your internet connection.");
          };
          document.body.appendChild(script);

        } else {
          alert(data.message || 'Payment initiation failed.');
        }
      })
      .catch(function(err) {
        console.error(err);
        alert('Connection error with payment gateway.');
      });
    }
  </script>
