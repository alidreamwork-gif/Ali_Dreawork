<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance - Ali Dreamwork</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .maintenance-container {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border: 2px solid #2563eb;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .brand-logo {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 2px solid #fbbf24;
      object-fit: cover;
      margin-bottom: 12px;
      background: #fff;
    }
    .brand-title {
      color: #fbbf24;
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 20px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .gear-icon {
      font-size: 45px;
      margin-bottom: 15px;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }
    h1 {
      font-size: 20px;
      color: #f8fafc;
      margin-bottom: 10px;
      font-weight: 800;
    }
    p {
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .status-badge {
      display: inline-block;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .support-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      color: #cbd5e1;
    }
    .support-box a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="maintenance-container">
    <img src="https://i.ibb.co/21P3nGZR/logo.jpg" alt="Logo" class="brand-logo">
    <div class="brand-title">✮⃝𝗔𝐋ɪᴰʳᵉᵃʷ®️k</div>
    
    <div class="gear-icon">🛠️</div>
    
    <h1>Website Under Maintenance</h1>
    <div class="status-badge">हम अभी मेंटेनेंस मोड पर हैं</div>
    
    <p>
      हमारी वेबसाइट पर अभी कुछ जरूरी अपडेट्स और सुधार का काम चल रहा है। बेहतर सर्विस के लिए हम जल्द ही वापस लौटेंगे। तब तक के लिए सहयोग बनाए रखें।
    </p>

    <div class="support-box">
      किसी भी सहायता के लिए संपर्क करें:<br>
      WhatsApp: <a href="https://wa.me/917776881407" target="_blank">+91 7776881407</a>
    </div>
  </div>

</body>
</html>
