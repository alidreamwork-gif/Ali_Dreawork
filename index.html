<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Under Maintenance - Ali Dreamwork</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .maintenance-container {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 24px;
      padding: 45px 30px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    }
    .icon-box {
      font-size: 55px;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #1e40af;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }
    p {
      font-size: 14.5px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #25d366, #20ba5a);
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
      transition: all 0.3s ease;
    }
    .whatsapp-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.5);
    }
    .whatsapp-icon {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }
    .footer-text {
      margin-top: 35px;
      font-size: 12px;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
