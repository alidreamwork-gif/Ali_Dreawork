<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Dreamwork Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f3f4f6; display: flex; justify-content: center; }
    .app-wrapper { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; padding-bottom: 30px; position: relative; }
    
    /* नीली पट्टी का हेडर */
    .top-navbar { 
      background: #1e40af; 
      padding: 8px 10px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      gap: 6px; 
    }
    .nav-brand-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .nav-brand-left img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #000000;
      object-fit: cover;
      background: #fff;
    }
    /* ब्रांड नेम - गोल्डन कलर */
    .nav-brand-title {
      color: #fbbf24;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.1;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .nav-buttons-right { 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
      align-items: flex-end; 
    }
    .nav-row {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
    }
    .nav-btn { 
      background: rgba(255,255,255,0.25); 
      border: 1px solid rgba(255,255,255,0.4); 
      color: white; 
      padding: 4px 7px; 
      border-radius: 12px; 
      font-size: 10px; 
      cursor: pointer; 
      font-weight: bold; 
      white-space: nowrap;
    }
    .nav-btn.active { background: #fff; color: #1e40af; }

    .container { padding: 12px; }
    .page-section { display: none; }

    /* कार रश बैनर */
    .banner-wrapper { margin: 2px 0 12px 0; text-align: center; }
    .race-banner-img { 
      width: 100%; 
      height: auto; 
      border-radius: 12px; 
      display: block; 
      cursor: pointer; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.12); 
    }

    /* कस्टम इन-पेज पॉपअप मॉडल (पेज से छोटा साइज और क्रॉस बटन) */
    #raceCustomModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      z-index: 999999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .custom-popup-box {
      position: relative;
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border-radius: 16px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      border: 2px solid #1e40af;
    }
    .custom-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #ef4444;
      color: #ffffff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .card { background: #fff; border: 1px solid #e5e7eb; padding: 14px; border-radius: 12px; }
    
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 13px; color: #374151; }
    .id-group { display: flex; gap: 6px; margin-top: 5px; }
    input[type="text"], input[type="tel"] { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
    
    .verify-btn { background: #059669; color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; font-size: 13px; }
    #verifyResult { margin-top: 10px; padding: 8px 12px; border-radius: 8px; font-size: 13px; display: none; align-items: center; gap: 10px; background: #ecfdf5; border: 1px solid #10b981; }
    .user-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid #10b981; flex-shrink: 0; }

    .section-title { font-size: 13px; font-weight: bold; color: #d97706; margin: 14px 0 10px 0; }
    .plans-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    
    .coin-card { 
      border: 2px solid #e5e7eb; 
      border-radius: 12px; 
      padding: 14px 6px; 
      background: #fafafa; 
      text-align: center; 
      cursor: pointer; 
    }
    .coin-card.selected { border-color: #059669; background: #f0fdf4; }
    .coin-number { font-size: 17px; font-weight: 800; color: #1e40af; }
    .coin-label { font-size: 10.5px; color: #6b7280; font-weight: 600; text-transform: uppercase; }
    .coin-divider { width: 34px; height: 2px; background: #e5e7eb; margin: 6px auto; }
    .coin-price { font-size: 15px; font-weight: bold; color: #059669; }

    .summary-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-top: 14px; font-size: 13px; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; color: #4b5563; }
    
    .terms-wrapper { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; color: #374151; }
    .terms-wrapper input[type="checkbox"] { width: 17px; height: 17px; cursor: pointer; accent-color: #2563eb; }

    .main-buy-btn { 
      width: 100%; 
      background: #2563eb; 
      color: #fff; 
      border: none; 
      padding: 13px; 
      font-size: 15px; 
      font-weight: bold; 
      border-radius: 8px; 
      cursor: pointer; 
      margin-top: 14px; 
    }

    .static-page h2 { color: #1e40af; font-size: 18px; margin-bottom: 10px; }
    .static-page p { font-size: 13px; color: #4b5563; line-height: 1.
