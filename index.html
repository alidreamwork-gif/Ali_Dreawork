<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
<script>
  let selectedCart = {};
  let currentTotalPages = 0;
  let currentTotalPrice = 0;

  function changeTab(tabName, btnElement) {
    document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active-page'));
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('tab-' + tabName).classList.add('active-page');
    btnElement.classList.add('active');
  }

  async function verifyUser() {
    const uid = document.getElementById('userId').value.trim();
    const resultDiv = document.getElementById('verifyResult');
    if (!uid) {
      alert("Please enter Customer ID");
      return;
    }
    resultDiv.style.display = "flex";
    resultDiv.innerHTML = "Verifying...";
    
    try {
      const response = await fetch('/api/verify-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid })
      });
      const data = await response.json();
      if (data.status === 200 || data.success) {
        resultDiv.innerHTML = `<img src="${data.avatar || 'https://i.ibb.co/21P3nGZR/logo.jpg'}" class="user-avatar"> <div><b>${data.nickname || 'User Found'}</b><br><span style="color:#059669; font-size:11px;">Verified Successfully</span></div>`;
      } else {
        resultDiv.innerHTML = `<span style="color:red;">${data.message || 'User not found!'}</span>`;
      }
    } catch (err) {
      resultDiv.innerHTML = `<span style="color:red;">Verification failed due to network error.</span>`;
    }
  }

  function updateQty(index, pagesPerItem, pricePerItem, change) {
    if (!selectedCart[index]) {
      selectedCart[index] = { qty: 0, pages: pagesPerItem, price: pricePerItem, name: document.querySelector(`#card-${index} .plan-title`).innerText };
    }
    
    selectedCart[index].qty += change;
    if (selectedCart[index].qty < 0) selectedCart[index].qty = 0;
    
    document.getElementById(`qty-${index}`).innerText = selectedCart[index].qty;
    
    if (selectedCart[index].qty === 0) {
      delete selectedCart[index];
      document.getElementById(`card-${index}`).classList.remove('selected');
    } else {
      document.getElementById(`card-${index}`).classList.add('selected');
    }
    
    calculateSummary();
  }

  function calculateSummary() {
    currentTotalPages = 0;
    currentTotalPrice = 0;
    let summaryNames = [];

    for (let key in selectedCart) {
      let item = selectedCart[key];
      currentTotalPages += item.pages * item.qty;
      currentTotalPrice += item.price * item.qty;
      summaryNames.push(`${item.name} (x${item.qty})`);
    }

    document.getElementById('sumPlan').innerText = summaryNames.length > 0 ? summaryNames.join(', ') : 'None';
    document.getElementById('sumPrice').innerText = '₹' + currentTotalPrice;
  }

  async function initiatePayment() {
    const uid = document.getElementById('userId').value.trim();
    const whatsapp = document.getElementById('userPhone').value.trim();

    if (!uid) {
      alert("Please enter and verify your Customer ID first!");
      return;
    }
    if (currentTotalPrice <= 0) {
      alert("Please select at least one E-Book bundle!");
      return;
    }

    const buyBtn = document.querySelector('.main-buy-btn');
    buyBtn.innerText = "Processing...";
    buyBtn.disabled = true;

    try {
      const response = await fetch('/api/create-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          uid: uid,
          amount: currentTotalPrice,
          whatsapp: whatsapp,
          cart: selectedCart
        })
      });

      const data = await response.json();

      if (data.success && data.payment_session_id) {
        // Cashfree SDK Initialization (Sandbox/Test Mode)
        const cashfree = Cashfree({
          mode: "sandbox" 
        });

        let checkoutOptions = {
          paymentSessionId: data.payment_session_id,
          redirectTarget: "_self"
        };
        
        cashfree.checkout(checkoutOptions);
      } else {
        alert(data.message || "Payment initiation failed.");
        buyBtn.innerText = "BUY NOW";
        buyBtn.disabled = false;
      }
    } catch (err) {
      console.error(err);
      alert("An error occurred during payment initiation.");
      buyBtn.innerText = "BUY NOW";
      buyBtn.disabled = false;
    }
  }
</script>
