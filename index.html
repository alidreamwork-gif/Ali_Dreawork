<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Dreamwork Store</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: sans-serif; background: #f3f4f6; margin: 0; padding: 0; display: flex; justify-content: center; }
    .app-wrapper { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
    
    /* Top Bar */
    .top-navbar { background: #1e40af; padding: 12px; text-align: center; position: sticky; top: 0; z-index: 99; }
    .nav-brand { color: #fff; font-size: 17px; font-weight: bold; margin-bottom: 8px; }
    .nav-buttons { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .nav-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 15px; font-size: 12px; cursor: pointer; font-weight: bold; }
    .nav-btn.active, .nav-btn:hover { background: #fff; color: #1e40af; }

    /* Content Area */
    .container { padding: 15px; flex: 1; }
    .page-section { display: none; }
    .page-section.active-page { display: block !important; }

    /* UI Header */
    .header { text-align: center; margin-bottom: 15px; }
    .logo-img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #d97706; object-fit: cover; }
    .brand-title { font-size: 20px; font-weight: bold; color: #1f2937; margin-top: 5px; }
    .card { background: #fff; border: 1px solid #e5e7eb; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
    
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 13px; color: #374151; }
    .id-group { display: flex; gap: 6px; margin-top: 5px; }
    input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
    
    .verify-btn { background: #059669; color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; font-size: 13px; }
    #verifyResult { margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; align-items: center; gap: 10px; background: #ecfdf5; border: 1px solid #10b981; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

    .section-title { font-size: 13px; font-weight: bold; color: #d97706; margin: 15px 0 10px 0; }
    .plans-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    
    /* 1-Tap Modern Coin Card */
    .coin-card { 
      border: 2px solid #e5e7eb; 
      border-radius: 12px; 
      padding: 16px 10px; 
      background: #fafafa; 
      text-align: center; 
      position: relative; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      user-select: none;
    }
    .coin-card:hover { border-color: #93c5fd; background: #f0f9ff; }
    .coin-card.selected { border-color: #059669; background: #f0fdf4; box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.2); }
    .coin-card.selected::after { 
      content: "✓ Selected"; 
      position: absolute; 
      top: 6px; 
      right: 6px; 
      background: #059669; 
      color: #fff; 
      font-size: 9px; 
      font-weight: bold; 
      padding: 2px 6px; 
      border-radius: 10px; 
    }
    
    .coin-number { font-size: 18px; font-weight: 800; color: #1e40af; margin-bottom: 4px; pointer-events: none; }
    .coin-label { font-size: 11px; color: #6b7280; font-weight: 600; text-transform: uppercase; pointer-events: none; }
    .coin-divider { width: 40px; height: 2px; background: #e5e7eb; margin: 8px auto; pointer-events: none; }
    .coin-price { font-size: 16px; font-weight: bold; color: #059669; pointer-events: none; }

    .summary-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-top: 15px; font-size: 13px; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; color: #4b5563; }
    
    .main-buy-btn { width: 100%; background: #2563eb; color: #fff; border: none; padding: 13px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; }

    /* Static Pages Styling */
    .static-page h2 { color: #1e40af; font-size: 18px; margin-top: 0; }
    .static-page p, .static-page li { font-size: 13px; color: #4b5563; line-height: 1.5; }

    /* BharatPe Modal Popup */
    #qrModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 330px;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
  </style>
</head>
