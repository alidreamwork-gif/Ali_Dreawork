<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coins Out of Stock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .stock-card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 16px;
      padding: 32px 20px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: #fff5f5;
      border: 2px solid #fed7d7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 38px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #e53e3e;
      margin-bottom: 12px;
    }
    .desc {
      font-size: 15px;
      color: #4a5568;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: #edf2f7;
      color: #4a5568;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    .btn-refresh {
      display: inline-block;
      width: 100%;
      background: #059669;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-refresh:hover {
      background: #047857;
    }
    .footer-note {
      font-size: 12px;
      color: #a0aec0;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="stock-card">
    <div class="icon-wrapper">
      🪙❌
    </div>

    <h1 class="title">Coins Out of Stock</h1>

    <p class="desc">
      All coin packs are temporarily sold out. We are refilling stock, please check back after some time.
    </p>

    <div class="badge">
      ⏳ Restocking Soon
    </div>

    <button class="btn-refresh" onclick="window.location.reload();">
      Check Again
    </button>

    <p class="footer-note">Thank you for your patience!</p>
  </div>

</body>
</html>
