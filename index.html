<!-- HTML Form Example -->
<div class="payment-box">
    <h3>Duoo Coin Recharge</h3>
    
    <!-- User UID Input -->
    <input type="text" id="userId" placeholder="Enter your User ID" required>
    
    <!-- Plan Selection -->
    <select id="coinPlan">
        <option value="14600">14,600 Coins</option>
        <option value="30000">30,000 Coins</option>
    </select>
    
    <!-- Pay Button -->
    <button onclick="startPayment()">Pay Now</button>
</div>
